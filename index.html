<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>REST Countries</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>
      <label for="capital">Stolica:</label>
      <input type="text" id="capital" placeholder="np. Warsaw">
      <button id="search">Szukaj</button>
    </div>

    <div id="answer">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Capital</th>
            <th>Population</th>
            <th>Region</th>
            <th>Subregion</th>
          </tr>
        </thead>
        <tbody id="results">
        </tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
